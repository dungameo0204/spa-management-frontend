name: Windows installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'dungameo0204/spa-management-frontend'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag and package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag must match package.json version"; exit 1; }
          node -e "const p=require('./package.json'); if(p.build.productName !== 'ROSA' || p.build.publish.owner !== 'dungameo0204' || p.build.publish.repo !== 'rosa-release') process.exit(1)"
      - run: npm ci
      - run: npm run lint
      - run: npm run check:vietnamese
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:installer
      - name: Publish installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ROSA_RELEASE_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if (!$env:GH_TOKEN) { throw 'ROSA_RELEASE_TOKEN with contents:write access to dungameo0204/rosa-release is required' }
          $installer = "release/ROSA-Setup-$version.exe"
          if (!(Test-Path $installer) -or !(Test-Path 'release/latest.yml') -or !(Test-Path "$installer.blockmap")) { throw 'Installer or update metadata missing' }
          gh release create $env:GITHUB_REF_NAME $installer "$installer.blockmap" 'release/latest.yml' --repo dungameo0204/rosa-release --title "ROSA $version" --notes "ROSA $version - source commit $env:GITHUB_SHA" --draft
          if ($LASTEXITCODE -ne 0) { throw 'ROSA release publication failed' }