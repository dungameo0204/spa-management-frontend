name: Windows installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag and package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag must match package.json version"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:installer
      - name: Publish installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/OHINA-Setup-$version.exe"
          if (!(Test-Path $installer) -or !(Test-Path 'release/latest.yml') -or !(Test-Path "$installer.blockmap")) { throw 'Installer or update metadata missing' }
          gh release create $env:GITHUB_REF_NAME $installer "$installer.blockmap" 'release/latest.yml' --title "O'HINA $version" --generate-notes --draft